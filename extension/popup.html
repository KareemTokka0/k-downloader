<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { width: 320px; margin: 0; padding: 14px; background: #17181b; color: #f2f3f5; font: 13px/1.5 "Segoe UI", Tahoma, Arial, sans-serif; }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .brand img { width: 28px; height: 28px; }
  .brand b { display: block; font-size: 14px; }
  .brand small { color: #a4a8b0; font-size: 11px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #2a2c31; }
  .sub { color: #a4a8b0; font-size: 12px; }
  .btn { min-height: 32px; padding: 4px 12px; border: 1px solid #3a3d44; border-radius: 8px; background: #26282d; color: #f2f3f5; font: 600 13px "Segoe UI", sans-serif; cursor: pointer; }
  .btn.primary { border-color: #15803d; background: #15803d; color: #fff; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 11px; background: #3a3d44; transition: .2s; }
  .switch span::before { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + span { background: #15803d; }
  .switch input:checked + span::before { transform: translateX(18px); }
  .dot::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #ef4444; vertical-align: middle; }
  .dot.ok::before { background: #3bf0a0; }
  input[type=text] { width: 100%; padding: 7px 9px; border: 1px solid #3a3d44; border-radius: 8px; background: #0f1012; color: #fff; font: 12px Consolas, monospace; }
  .recent { max-height: 160px; overflow: auto; font-size: 12px; }
  .recent div { padding: 4px 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border-top: 1px solid #2a2c31; }
  .recent .err { color: #fca5a5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="brand"><img src="icons/48.png" alt=""><div><b>K Downloader</b><small>Chrome extension</small></div></div>
<div class="row"><span id="status" class="dot">Checking...</span><button id="connect" class="btn primary">Connect</button></div>
<div class="row"><div><b>Capture downloads</b><div class="sub">Files you download in Chrome go through K Downloader</div></div><label class="switch"><input id="enabled" type="checkbox"><span></span></label></div>
<div class="row" style="flex-direction:column;align-items:stretch;gap:6px"><input id="url" type="text" placeholder="Paste a link and press Enter to download it" spellcheck="false"><div id="sent" class="sub"></div></div>
<div class="row" style="border-bottom:0"><b>Recent</b><button id="clear" class="btn" style="min-height:26px;padding:2px 8px;font-size:12px">Clear</button></div>
<div id="recent" class="recent"></div>
<script src="popup.js"></script>
</body>
</html>
